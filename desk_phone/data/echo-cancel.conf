# Desk Phone's echo canceller. Desk Phone runs `pipewire -c <this file>` while a call's audio is
# on the computer and stops it when the call leaves; the call's Bluetooth streams are moved onto
# the two nodes below, so the caller doesn't hear their own voice back from your speakers.
context.properties = {
    log.level = 2
}
context.spa-libs = {
    audio.convert.* = audioconvert/libspa-audioconvert
    support.*       = support/libspa-support
}
context.modules = [
    { name = libpipewire-module-rt
        args = { }
        flags = [ ifexists nofail ]
    }
    { name = libpipewire-module-protocol-native }
    { name = libpipewire-module-client-node }
    { name = libpipewire-module-adapter }
    { name = libpipewire-module-echo-cancel
        args = {
            library.name   = aec/libspa-aec-webrtc
            audio.channels = 1
            audio.position = [ MONO ]
            capture.props = {
                node.name        = "deskphone.ec.capture"
                node.description = "Desk Phone microphone"
            }
            source.props = {
                node.name        = "deskphone.ec.source"
                node.description = "Desk Phone call microphone"
                priority.session = 1
            }
            sink.props = {
                node.name        = "deskphone.ec.sink"
                node.description = "Desk Phone call speaker"
                priority.session = 1
            }
            playback.props = {
                node.name        = "deskphone.ec.playback"
                node.description = "Desk Phone call voice"
            }
        }
    }
]
